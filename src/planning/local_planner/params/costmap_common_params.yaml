
obstacle_range: 30
raytrace_range: 30

obstacle_layer:
  enable: True
  combination_method: 1
  track_unknown_space: True
  observation_sources: point_cloud_sensor
  point_cloud_sensor: {
    sensor_frame: OurCar/Sensors/DepthCamera, 
    data_type: PointCloud2, 
    topic: /points, 
    marking: true, 
    clearing: true
  }

cost_type: costmap

inflater_layer:
  enabled: true
  inflation_radius: 0.5
  cost_scaling_factor: 3.0

static_layer:
  enabled: true
