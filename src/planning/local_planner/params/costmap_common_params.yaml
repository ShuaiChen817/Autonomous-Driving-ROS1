robot_radius: 2.2
# inflation_radius: 0.2
obstacle_range: 60
raytrace_range: 60

# observation_sources: point_cloud_sensor 

# point_cloud_sensor:
#   sensor_frame: "OurCar/Sensors/DepthCamera"
#   data_type: PointCloud2
#   topic: "/points"
#   marking: true
#   clearing: true
#   max_obstacle_height: 1.5
#   min_obstacle_height: 0.3


obstacle_layer:
  observation_sources: point_cloud_sensor 

  point_cloud_sensor:
    sensor_frame: "OurCar/Sensors/DepthCamera"
    data_type: PointCloud2
    topic: "/points"
    marking: true
    clearing: true
    max_obstacle_height: 1.5
    min_obstacle_height: 0.1


inflation_layer:
  inflation_radius: 2     # 根据你机器大小设置
  cost_scaling_factor: 5.0  # 越大下降越快（越陡），越小影响范围越广
