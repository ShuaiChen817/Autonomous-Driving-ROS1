  global_costmap:
    global_frame: map
    robot_base_frame: OurCar/INS
    update_frequency: 2.0
    publish_frequency: 2.0
    resolution: 1
    static_map: false

    # Increase these dimensions otherwise sensor out of map boundary
    width: 2000  # Increase these dimensions
    height: 2000  # Increase these dimensions    
    


    plugins: 
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}


    # definition of recovery
    recovery_behaviors:
    - name: clear_costmap   # clean obstacle messages in a certain ranger
      type: clear_costmap_recovery/ClearCostmapRecovery



