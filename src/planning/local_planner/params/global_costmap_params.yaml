global_costmap:

  global_frame: world
  robot_base_frame: base_link
  update_frequency: 1.0
  publish_frequency: 1.0
  # static_map: false
  resolution: 0.5
  # Increase these dimensions otherwise sensor out of map boundary
  # width: 10.0  # Increase these dimensions
  # height: 10.0  # Increase these dimensions
  footprint_model:
    type: "polygon"
    vertices: [[1.5, -1], [-1.5, -1],[-1.5, 1], [1.5, 1]] # for type "polygon"
  always_send_full_costmap: true

  plugins: 
      - {name: static_layer,       type: "costmap_2d::StaticLayer"}
       
      - {name: inflation_layer,         type: "costmap_2d::InflationLayer"}