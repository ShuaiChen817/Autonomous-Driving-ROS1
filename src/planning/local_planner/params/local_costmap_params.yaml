local_costmap:

  # global_frame: world
  global_frame: map
  robot_base_frame: OurCar/INS
  update_frequency: 50.0
  publish_frequency: 50.0
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.5
  transform_tolerance: 0.5



  plugins: 
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

