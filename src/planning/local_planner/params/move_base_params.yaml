base_global_planner: "navfn/NavfnROS"
base_local_planner: "teb_local_planner/TebLocalPlannerROS"

robot_base_frame: "OurCar/INS"
global_frame: "world"

planner_frequency: 20.0
controller_frequency: 20.0

planner_patience: 30            # Maximum waiting time for the planner (in seconds)
controller_patience: 30         # Maximum waiting time for the controller (in seconds)
oscillation_timeout: 0          # Trigger recovery if there's no movement beyond this time (can be increased)
oscillation_distance: 0         # Movement distance considered as oscillation
recovery_behavior_enabled: false

shutdown_costmaps: false        # Do not shutdown costmaps (recommended to keep false during debugging)

# Goal tolerance (you must add this now!)
xy_goal_tolerance: 4            # Positional tolerance to goal (try setting a larger value)
yaw_goal_tolerance: 3.14        # Orientation tolerance (can be set large if not needed)
